[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-etl"
version = "1.2.0"
description = "Local FastAPI ETL: fetch JSON, store it in SQLite, and score anomalies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bharal-sahab" }]
keywords = ["etl", "fastapi", "sqlite", "json"]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlmodel>=0.0.22,<0.1.0",
    "httpx>=0.27.0,<0.29.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "respx>=0.21.1,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/bharal-sahab/automated-ETL"
Repository = "https://github.com/bharal-sahab/automated-ETL"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["api*", "core*", "db*", "services*"]
